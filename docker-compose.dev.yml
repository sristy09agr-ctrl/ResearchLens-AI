services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: researchlens-qdrant-dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage:z
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 8s
      timeout: 4s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: researchlens-api-dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app", "--reload-dir", "modules"]
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_PRIMARY_MODEL=${GEMINI_PRIMARY_MODEL:-gemini-2.0-flash}
      - GEMINI_CHEAP_MODEL=${GEMINI_CHEAP_MODEL:-gemini-2.0-flash-lite}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-1.5-flash}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=researchlens_chunks
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
    volumes:
      # Live hot-reloading: bind mount source code into container
      - ./app:/app/app
      - ./modules:/app/modules
      - ./backend:/app/backend
      - ./eval:/app/eval
      - ./data:/app/data
      - ./.env:/app/.env
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: researchlens-frontend-dev
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://api:8000
    volumes:
      # Live hot-reloading for React
      - ./frontend:/app
      # Anonymous volume so container keeps its own installed node_modules
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: researchlens-dev-network

